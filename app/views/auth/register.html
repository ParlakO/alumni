{% extends "layout.html" %}
{% block content %}
<div class="card" style="max-width: 560px; margin: 0 auto;">
  <h2>✨ Yeni Mezun Kaydı (Register)</h2>
  <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.25rem;">
    Sisteme <code>graduate</code> rolü ile kayıt olun. Parolanız <code>bcrypt (hash + salt)</code> ile güvenle saklanır.
  </p>

  <form method="POST" action="/register" class="grid">
    <label class="full">
      Ad Soyad *
      <input type="text" name="name" value="{{ form.name or '' }}" required minlength="2" placeholder="Örn: Zeynep Kaya">
    </label>
    <label class="full">
      E-posta Adresi *
      <input type="email" name="email" value="{{ form.email or '' }}" required placeholder="Örn: zeynep@iu.edu.tr">
    </label>
    <label class="full">
      Mezun Olunan Bölüm *
      <input type="text" name="department" value="{{ form.department or '' }}" required minlength="2" placeholder="Örn: Yönetim Bilişim Sistemleri">
    </label>
    <label>
      Parola (En az 6 karakter) *
      <input type="password" name="password" required minlength="6" placeholder="••••••">
    </label>
    <label>
      Parola Tekrar *
      <input type="password" name="password_confirm" required minlength="6" placeholder="••••••">
    </label>
    <div class="full actions" style="margin-top: 0.5rem;">
      <button type="submit" class="btn btn-primary">Kayıt Ol ve Giriş Yap</button>
      <a href="/login" class="btn btn-light">Zaten hesabım var (Giriş)</a>
    </div>
  </form>
</div>
{% endblock %}
