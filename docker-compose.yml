services:
  alumni-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alumni_tracking_system
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - APP_NAME=${APP_NAME:-Alumni Tracking System}
      - STUDENT_NAME=${STUDENT_NAME:-Osman Parlak}
      - COURSE_CODE=${COURSE_CODE:-YBSB3001}
      - UNIVERSITY=${UNIVERSITY:-İstanbul Üniversitesi}
      - ARCHITECTURE=${ARCHITECTURE:-MVC (Model-View-Controller)}
      - STORAGE_TYPE=${STORAGE_TYPE:-In-Memory (UserModel - No DB)}
      - DATA_DESIGN_DOC=${DATA_DESIGN_DOC:-ddd.md}
    volumes:
      - ./app:/app/app
      - ./ddd.md:/app/ddd.md:ro
      - ./README.md:/app/README.md:ro
    labels:
      org.opencontainers.image.title: "Alumni Tracking System API"
      org.opencontainers.image.description: "MVC mimarisinde In-Memory UserModel ve cift Controller ile Mezun Takip Sistemi"
      org.opencontainers.image.authors: "Osman Parlak"
      org.opencontainers.image.version: "1.0.0"
      org.opencontainers.image.documentation: "ddd.md"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
